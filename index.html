<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="img/android-chrome-192x192.png" type="image/x-icon">

    <title>Minha Calculadora</title>
</head>

<body>

    <div class="container">

        <div class="Calculadora">

            <input type="text" class="display" readonly>

            <div class="botoes">

                <button class="btn btn-deletar-tudo">CE</button>
                <button class="btn btn-delete">C</button>
                <button class="btn btn-porcentagem">%</button>
                <button class="btn btn-operacao">X</button>

                <button class="btn btn-num">7</button>
                <button class="btn btn-num">8</button>
                <button class="btn btn-num">9</button>
                <button class="btn btn-operacao">+</button>

                <button class="btn btn-num">4</button>
                <button class="btn btn-num">5</button>
                <button class="btn btn-num">6</button>
                <button class="btn btn-operacao">/</button>

                <button class="btn btn-num">1</button>
                <button class="btn btn-num">2</button>
                <button class="btn btn-num">3</button>
                <button class="btn btn-operacao">-</button>

                <button class="btn btn-num">0</button>
                <button class="btn btn-virgula">,</button>
                <button class="btn btn-resultado">=</button>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
